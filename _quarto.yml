project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!content-archive/"
    - "!old_website/"
  # Imagens citadas só em `style` ou em templates EJS não são descobertas
  # pelo Quarto; a pasta entra explicitamente.
  resources:
    - static/images/

website:
  title: "Academy"
  description: "Tutoriais de R, gráficos e cursos de economia aplicada da EKIO"
  site-url: "https://academy.ekio.io"
  favicon: static/images/brand/monogram-navy.svg
  open-graph: true

  navbar:
    logo: static/images/brand/lockup-navy.svg
    logo-alt: "EKIO"
    logo-href: /index.qmd
    title: "Academy"
    background: "#F1F1F1"
    foreground: "#373A3D"
    search: false
    collapse-below: md
    right:
      - text: "Tutoriais"
        href: tutorials/index.qmd
      - text: "Gráficos"
        href: weekly-charts/index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Cursos"
        href: cursos.qmd
      - text: "Livros"
        href: livros.qmd
      - text: "Sobre"
        href: sobre.qmd

  page-footer:
    background: "#F1F1F1"
    foreground: "#52555A"
    left: "© 2026 EKIO Academy"
    right: |
      [ekio.io](https://ekio.io) · [GitHub](https://github.com/viniciusoike) · [LinkedIn](https://linkedin.com/in/viniciusoike)

lang: pt

format:
  html:
    theme:
      - cosmo
      - static/theme.scss
    include-in-header: static/head.html
    toc: false
    anchor-sections: false
    section-divs: false
    code-tools: false
    link-external-newwindow: true
    highlight-style: assets/themes/material-palenight-r.theme

execute:
  # Content is rendered locally and frozen; the build never runs R.
  freeze: true
  cache: true
  echo: true
  warning: false
  message: false
