# Quarto runs on Netlify without R: pages with code are rendered from _freeze/,
# which is committed. Run `quarto render` locally before pushing new tutorials.
[build]
  command = "mkdir -p /tmp/quarto && curl -sL https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.37/quarto-1.9.37-linux-amd64.tar.gz | tar -xz -C /tmp/quarto && /tmp/quarto/quarto-1.9.37/bin/quarto render"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
